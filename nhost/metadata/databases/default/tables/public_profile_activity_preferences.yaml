table:
  name: profile_activity_preferences
  schema: public
object_relationships:
  - name: profile
    using:
      manual_configuration:
        column_mapping:
          user_id: user_id
        remote_table:
          name: profiles
          schema: public
  - name: activity
    using:
      foreign_key_constraint_on: activity_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - activity_id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
