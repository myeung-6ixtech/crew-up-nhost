table:
  name: verifications
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: reviewer
    using:
      foreign_key_constraint_on: reviewed_by
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - method
        - document_file_id
        - notes
update_permissions:
  - role: staff_admin
    permission:
      columns:
        - status
        - reviewed_by
        - reviewed_at
        - rejection_reason
        - notes
      filter: {}
      check: {}
