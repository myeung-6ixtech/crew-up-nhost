table:
  name: connections
  schema: public
object_relationships:
  - name: requester
    using:
      foreign_key_constraint_on: requester_id
  - name: addressee
    using:
      foreign_key_constraint_on: addressee_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _or:
          - requester_id:
              _eq: X-Hasura-User-Id
          - addressee_id:
              _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        requester_id:
          _eq: X-Hasura-User-Id
      set:
        requester_id: X-Hasura-User-Id
      columns:
        - addressee_id
        - message
update_permissions:
  - role: user
    permission:
      columns:
        - status
      filter:
        _or:
          - requester_id:
              _eq: X-Hasura-User-Id
          - addressee_id:
              _eq: X-Hasura-User-Id
      check: null
