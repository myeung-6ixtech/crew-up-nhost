table:
  name: connections
  schema: public
object_relationships:
  - name: requester
    using:
      foreign_key_constraint_on: requester_id
  - name: addressee
    using:
      foreign_key_constraint_on: addressee_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - _or:
              - requester_id:
                  _eq: X-Hasura-User-Id
              - addressee_id:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - requester_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      set:
        requester_id: X-Hasura-User-Id
      columns:
        - addressee_id
        - message
  - role: service
    permission:
      check: {}
      columns: '*'
update_permissions:
  - role: user
    permission:
      columns:
        - status
      filter:
        _and:
          - _or:
              - requester_id:
                  _eq: X-Hasura-User-Id
              - addressee_id:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      check: null
  - role: service
    permission:
      columns: '*'
      filter: {}
      check: {}
