table:
  name: activities
  schema: public
object_relationships:
  - name: parent
    using:
      foreign_key_constraint_on: parent_id
array_relationships:
  - name: children
    using:
      foreign_key_constraint_on:
        column: parent_id
        table:
          name: activities
          schema: public
  - name: eventActivities
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: event_activities
          schema: public
  - name: profilePreferences
    using:
      foreign_key_constraint_on:
        column: activity_id
        table:
          name: profile_activity_preferences
          schema: public
select_permissions:
  - role: public
    permission:
      columns:
        - id
        - slug
        - name
        - description
        - category
        - icon
        - sort_order
        - is_active
        - kind
        - parent_id
      filter:
        is_active:
          _eq: true
  - role: user
    permission:
      columns:
        - id
        - slug
        - name
        - description
        - category
        - icon
        - sort_order
        - is_active
        - kind
        - parent_id
      filter:
        is_active:
          _eq: true
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: staff_admin
    permission:
      check: {}
      columns:
        - slug
        - name
        - description
        - category
        - icon
        - sort_order
        - is_active
        - kind
        - parent_id
update_permissions:
  - role: staff_admin
    permission:
      columns:
        - slug
        - name
        - description
        - category
        - icon
        - sort_order
        - is_active
        - kind
        - parent_id
      filter: {}
      check: {}
delete_permissions: []
