table:
  name: rosters
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
event_triggers:
  - name: rosters_presence_compute
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 120
    webhook: '{{NHOST_FUNCTIONS_URL}}/internal/presence-compute'
    headers:
      - name: nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      set:
        user_id: X-Hasura-User-Id
      columns:
        - flight_number
        - departure_airport
        - arrival_airport
        - layover_city
        - layover_start
        - layover_end
        - source
        - source_file_id
        - notes
update_permissions:
  - role: user
    permission:
      columns:
        - flight_number
        - departure_airport
        - arrival_airport
        - layover_city
        - layover_start
        - layover_end
        - source
        - source_file_id
        - notes
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
