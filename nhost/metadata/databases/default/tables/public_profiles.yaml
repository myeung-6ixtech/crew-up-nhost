table:
  name: profiles
  schema: public
object_relationships:
  - name: airline
    using:
      foreign_key_constraint_on: airline_id
  - name: baseAirport
    using:
      foreign_key_constraint_on: base_airport_iata
  - name: onboardingState
    using:
      manual_configuration:
        column_mapping:
          user_id: user_id
        insertion_order: null
        remote_table:
          name: onboarding_state
          schema: public
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: activityPreferences
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: profile_activity_preferences
          schema: public
computed_fields:
  - name: own_date_of_birth
    definition:
      function:
        name: profile_own_date_of_birth
        schema: public
      session_argument: hasura_session
    comment: date_of_birth for the caller's own row; null for everyone else
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - display_name
        - airline_id
        - base_airport
        - role_type
        - rank
        - show_rank
        - preferred_language
        - default_visibility
        - notification_mode
        - is_verified
        - avatar_file_id
        - friend_id
        - full_name
        - full_name_native
        - preferred_name
        - username
        - home_country_code
        - hometown_city
        - languages
        - residence_country_code
        - residence_city
        - crew_role
        - base_airport_iata
        - created_at
        - updated_at
      computed_fields:
        - own_date_of_birth
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - _and:
              - is_verified:
                  _eq: true
              - user_id:
                  _neq: X-Hasura-User-Id
              - onboardingState:
                  onboarding_completed_at:
                    _is_null: false
              - _exists:
                  _table:
                    name: onboarding_state
                    schema: public
                  _where:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - onboarding_completed_at:
                          _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: moderator
    permission:
      columns:
        - user_id
        - display_name
        - full_name
        - username
        - airline_id
        - base_airport
        - base_airport_iata
        - role_type
        - crew_role
        - is_verified
      filter: {}
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - display_name
        - airline_id
        - base_airport
        - role_type
        - rank
        - show_rank
        - preferred_language
        - default_visibility
        - notification_mode
        - avatar_file_id
update_permissions:
  - role: user
    permission:
      columns:
        - display_name
        - airline_id
        - base_airport
        - role_type
        - rank
        - show_rank
        - preferred_language
        - default_visibility
        - notification_mode
        - avatar_file_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns:
        - is_verified
        - airline_id
      filter: {}
      check: {}
