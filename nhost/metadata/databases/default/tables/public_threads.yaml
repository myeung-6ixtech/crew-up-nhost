table:
  name: threads
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
array_relationships:
  - name: messages
    using:
      foreign_key_constraint_on:
        column: thread_id
        table:
          name: messages
          schema: public
  - name: participants
    using:
      foreign_key_constraint_on:
        column: thread_id
        table:
          name: thread_participants
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - _or:
              - participants:
                  user_id:
                    _eq: X-Hasura-User-Id
              - event:
                  creator_id:
                    _eq: X-Hasura-User-Id
              - event:
                  attendees:
                    user_id:
                      _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: onboarding_state
            schema: public
          _where:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - onboarding_completed_at:
                  _is_null: false
      columns:
        - type
        - event_id
