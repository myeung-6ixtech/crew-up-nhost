table:
  name: users
  schema: auth
# Standard Nhost Auth GraphQL shape (users / user / displayName / userProviders, …).
# CrewUp adds the public.profiles relationship for JWT custom claims.
configuration:
  custom_name: users
  custom_root_fields:
    select: users
    select_by_pk: user
    select_aggregate: usersAggregate
    insert: insertUsers
    insert_one: insertUser
    update: updateUsers
    update_by_pk: updateUser
    delete: deleteUsers
    delete_by_pk: deleteUser
  column_config:
    active_mfa_type:
      custom_name: activeMfaType
    avatar_url:
      custom_name: avatarUrl
    created_at:
      custom_name: createdAt
    default_role:
      custom_name: defaultRole
    display_name:
      custom_name: displayName
    email_verified:
      custom_name: emailVerified
    is_anonymous:
      custom_name: isAnonymous
    last_seen:
      custom_name: lastSeen
    new_email:
      custom_name: newEmail
    otp_hash:
      custom_name: otpHash
    otp_hash_expires_at:
      custom_name: otpHashExpiresAt
    otp_method_last_used:
      custom_name: otpMethodLastUsed
    password_hash:
      custom_name: passwordHash
    phone_number:
      custom_name: phoneNumber
    phone_number_verified:
      custom_name: phoneNumberVerified
    ticket_expires_at:
      custom_name: ticketExpiresAt
    totp_secret:
      custom_name: totpSecret
    updated_at:
      custom_name: updatedAt
    webauthn_current_challenge:
      custom_name: currentChallenge
object_relationships:
  - name: defaultRoleByRole
    using:
      foreign_key_constraint_on: default_role
  - name: profile
    using:
      manual_configuration:
        column_mapping:
          id: user_id
        insertion_order: null
        remote_table:
          name: profiles
          schema: public
array_relationships:
  - name: refreshTokens
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: refresh_tokens
          schema: auth
  - name: roles
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_roles
          schema: auth
  - name: securityKeys
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_security_keys
          schema: auth
  - name: userProviders
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: user_providers
          schema: auth
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - display_name
        - email
        - avatar_url
        - disabled
        - default_role
      filter: {}
