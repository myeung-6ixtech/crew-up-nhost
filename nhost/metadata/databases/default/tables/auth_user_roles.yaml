table:
  name: user_roles
  schema: auth
configuration:
  custom_name: authUserRoles
  custom_root_fields:
    select: authUserRoles
    select_by_pk: authUserRole
    select_aggregate: authUserRolesAggregate
    insert: insertAuthUserRoles
    insert_one: insertAuthUserRole
    update: updateAuthUserRoles
    update_by_pk: updateAuthUserRole
    delete: deleteAuthUserRoles
    delete_by_pk: deleteAuthUserRole
  column_config:
    created_at:
      custom_name: createdAt
    user_id:
      custom_name: userId
object_relationships:
  - name: roleByRole
    using:
      foreign_key_constraint_on: role
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - role
        - user_id
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: staff_admin
    permission:
      check: {}
      columns:
        - user_id
        - role
delete_permissions:
  - role: staff_admin
    permission:
      filter: {}
