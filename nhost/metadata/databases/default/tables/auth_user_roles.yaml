table:
  name: user_roles
  schema: auth
# Nhost Auth expects authUserRoles — not auth_user_roles.
configuration:
  custom_name: authUserRoles
  custom_root_fields:
    select: authUserRoles
    select_by_pk: authUserRole
    select_aggregate: authUserRolesAggregate
    insert: insertAuthUserRoles
    insert_one: insertAuthUserRole
  column_config:
    user_id:
      custom_name: userId
    created_at:
      custom_name: createdAt
object_relationships:
  - name: roleByRole
    using:
      foreign_key_constraint_on: role
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - role
        - user_id
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
