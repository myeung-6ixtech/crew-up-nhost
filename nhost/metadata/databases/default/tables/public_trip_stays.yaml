table:
  name: trip_stays
  schema: public
object_relationships:
  - name: trip
    using:
      foreign_key_constraint_on: trip_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      columns:
        - trip_id
        - city
        - airport_iata
        - starts_at
        - ends_at
  - role: service
    permission:
      check: {}
      columns: '*'
update_permissions:
  - role: user
    permission:
      columns:
        - city
        - airport_iata
        - starts_at
        - ends_at
      filter:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      check:
        trip:
          user_id:
            _eq: X-Hasura-User-Id
  - role: service
    permission:
      columns: '*'
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: service
    permission:
      filter: {}
