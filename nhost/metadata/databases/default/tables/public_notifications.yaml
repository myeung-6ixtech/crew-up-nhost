table:
  name: notifications
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregates: true
update_permissions:
  - role: user
    permission:
      columns:
        - read_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: service
    permission:
      check: {}
      columns: '*'
