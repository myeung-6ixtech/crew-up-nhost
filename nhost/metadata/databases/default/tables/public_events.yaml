table:
  name: events
  schema: public
object_relationships:
  - name: creator
    using:
      foreign_key_constraint_on: creator_id
array_relationships:
  - name: attendees
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_attendees
          schema: public
  - name: eventActivities
    using:
      foreign_key_constraint_on:
        column: event_id
        table:
          name: event_activities
          schema: public
  - name: thread
    using:
      manual_configuration:
        column_mapping:
          id: event_id
        insertion_order: null
        remote_table:
          name: threads
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - _or:
              - host_type:
                  _eq: user
              - _and:
                  - host_type:
                      _eq: platform
                  - is_published:
                      _eq: true
          - _or:
              - visibility_scope:
                  _eq: all_verified
              - _and:
                  - visibility_scope:
                      _eq: same_airline
                  - creator:
                      profile:
                        airline_id:
                          _eq: X-Hasura-Airline-Id
                  - creator:
                      profile:
                        airline_id:
                          _is_null: false
              - creator_id:
                  _eq: X-Hasura-User-Id
              - attendees:
                  user_id:
                    _eq: X-Hasura-User-Id
              - thread:
                  participants:
                    user_id:
                      _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - creator_id:
              _eq: X-Hasura-User-Id
          - _or:
              - visibility_scope:
                  _neq: same_airline
              - _exists:
                  _table:
                    schema: public
                    name: profiles
                  _where:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - airline_id:
                          _is_null: false
      set:
        creator_id: X-Hasura-User-Id
      columns:
        - title
        - description
        - city
        - venue_name
        - venue_address
        - starts_at
        - ends_at
        - capacity
        - visibility_scope
        - tags
        - languages
  - role: staff_admin
    permission:
      check:
        host_type:
          _eq: platform
      set:
        creator_id: X-Hasura-User-Id
      columns:
        - title
        - description
        - city
        - venue_name
        - venue_address
        - starts_at
        - ends_at
        - capacity
        - visibility_scope
        - tags
        - languages
        - host_type
        - is_published
        - published_at
        - featured_until
update_permissions:
  - role: user
    permission:
      columns:
        - title
        - description
        - city
        - venue_name
        - venue_address
        - starts_at
        - ends_at
        - capacity
        - visibility_scope
        - tags
        - languages
      filter:
        _and:
          - creator_id:
              _eq: X-Hasura-User-Id
          - host_type:
              _eq: user
      check:
        _and:
          - creator_id:
              _eq: X-Hasura-User-Id
          - host_type:
              _eq: user
          - _or:
              - visibility_scope:
                  _neq: same_airline
              - _exists:
                  _table:
                    schema: public
                    name: profiles
                  _where:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - airline_id:
                          _is_null: false
  - role: staff_admin
    permission:
      columns:
        - title
        - description
        - city
        - venue_name
        - venue_address
        - starts_at
        - ends_at
        - capacity
        - visibility_scope
        - tags
        - languages
        - is_published
        - published_at
        - featured_until
      filter:
        host_type:
          _eq: platform
      check:
        host_type:
          _eq: platform
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - creator_id:
              _eq: X-Hasura-User-Id
          - host_type:
              _eq: user
  - role: staff_admin
    permission:
      filter:
        host_type:
          _eq: platform
