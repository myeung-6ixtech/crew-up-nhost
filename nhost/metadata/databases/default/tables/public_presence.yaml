table:
  name: presence
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: roster
    using:
      foreign_key_constraint_on: roster_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - city
        - date_start
        - date_end
        - visibility
      filter:
        _and:
          - _and:
              - visibility:
                  _neq: off
              - user_id:
                  _neq: X-Hasura-User-Id
              - _or:
                  - visibility:
                      _eq: all_verified
                  - _and:
                      - visibility:
                          _eq: same_airline
                      - user:
                          profile:
                            airline_id:
                              _eq: X-Hasura-Airline-Id
                      - user:
                          profile:
                            airline_id:
                              _is_null: false
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: service
    permission:
      check: {}
      columns: '*'
update_permissions:
  - role: service
    permission:
      columns: '*'
      filter: {}
      check: {}
delete_permissions:
  - role: service
    permission:
      filter: {}
