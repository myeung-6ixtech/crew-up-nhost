table:
  name: thread_participants
  schema: public
object_relationships:
  - name: thread
    using:
      foreign_key_constraint_on: thread_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        thread:
          participants:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - thread_id
        - user_id
update_permissions:
  - role: user
    permission:
      columns:
        - last_read_at
        - muted_until
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
