table:
  name: trip_flight_legs
  schema: public
object_relationships:
  - name: trip
    using:
      foreign_key_constraint_on: trip_id
  - name: flight
    using:
      foreign_key_constraint_on: flight_instance_id
event_triggers:
  - name: trip_flight_legs_match_compute
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 120
    webhook: '{{NHOST_FUNCTIONS_URL}}/internal/trip-matches-compute'
    headers:
      - name: nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        trip:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        trip:
          user_id:
            _eq: X-Hasura-User-Id
      columns:
        - trip_id
        - flight_instance_id
        - sequence_number
  - role: service
    permission:
      check: {}
      columns: '*'
delete_permissions:
  - role: user
    permission:
      filter:
        trip:
          user_id:
            _eq: X-Hasura-User-Id
  - role: service
    permission:
      filter: {}
