table:
  name: trip_flight_legs
  schema: public
object_relationships:
  - name: trip
    using:
      foreign_key_constraint_on: trip_id
  - name: flight
    using:
      foreign_key_constraint_on: flight_instance_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      columns:
        - trip_id
        - flight_instance_id
        - sequence_number
  - role: service
    permission:
      check: {}
      columns: '*'
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - trip:
              user_id:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: service
    permission:
      filter: {}
