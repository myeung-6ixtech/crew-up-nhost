table:
  name: user_blocks
  schema: public
object_relationships:
  - name: blocker
    using:
      foreign_key_constraint_on: blocker_id
  - name: blocked
    using:
      foreign_key_constraint_on: blocked_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        blocker_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        blocker_id:
          _eq: X-Hasura-User-Id
      set:
        blocker_id: X-Hasura-User-Id
      columns:
        - blocked_id
        - reason
delete_permissions:
  - role: user
    permission:
      filter:
        blocker_id:
          _eq: X-Hasura-User-Id
