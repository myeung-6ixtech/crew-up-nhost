table:
  name: airports
  schema: public
select_permissions:
  - role: public
    permission:
      columns:
        - iata
        - icao
        - name
        - city
        - country_code
        - tz
        - is_major
      filter:
        is_active:
          _eq: true
  - role: user
    permission:
      columns:
        - iata
        - icao
        - name
        - city
        - country_code
        - tz
        - is_major
      filter:
        is_active:
          _eq: true
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: staff_admin
    permission:
      check: {}
      columns:
        - iata
        - icao
        - name
        - city
        - country_code
        - tz
        - is_major
        - is_active
update_permissions:
  - role: staff_admin
    permission:
      columns:
        - icao
        - name
        - city
        - country_code
        - tz
        - is_major
        - is_active
      filter: {}
      check: {}
