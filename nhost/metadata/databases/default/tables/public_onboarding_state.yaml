table:
  name: onboarding_state
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - current_step
        - flow_version
        - beta_signup_completed_at
        - onboarding_completed_at
        - guidelines_accepted_version
        - guidelines_accepted_at
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns: '*'
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - current_step
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
