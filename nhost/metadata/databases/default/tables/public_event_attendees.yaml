table:
  name: event_attendees
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - _or:
              - user_id:
                  _eq: X-Hasura-User-Id
              - event:
                  creator_id:
                    _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - event:
                  _or:
                    - host_type:
                        _eq: user
                    - _and:
                        - host_type:
                            _eq: platform
                        - is_published:
                            _eq: true
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      set:
        user_id: X-Hasura-User-Id
      columns:
        - event_id
        - status
update_permissions:
  - role: user
    permission:
      columns:
        - status
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
