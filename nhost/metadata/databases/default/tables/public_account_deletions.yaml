table:
  name: account_deletions
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - requested_at
        - purge_after
        - cancelled_at
        - purged_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
