table:
  name: files
  schema: storage
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - bucket_id
        - name
        - size
        - mime_type
        - created_at
        - updated_at
        - uploaded_by_user_id
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
      set:
        uploaded_by_user_id: X-Hasura-User-Id
      columns:
        - bucket_id
        - name
        - size
        - mime_type
delete_permissions:
  - role: user
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
