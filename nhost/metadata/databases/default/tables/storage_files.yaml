table:
  name: files
  schema: storage
# Nhost Storage queries/mutates `files` on query_root — not `storage_files`.
configuration:
  custom_name: files
  custom_root_fields:
    select: files
    select_by_pk: file
    select_aggregate: filesAggregate
    insert: insertFiles
    insert_one: insertFile
    update: updateFiles
    update_by_pk: updateFile
    delete: deleteFiles
    delete_by_pk: deleteFile
  column_config:
    bucket_id:
      custom_name: bucketId
    mime_type:
      custom_name: mimeType
    uploaded_by_user_id:
      custom_name: uploadedByUserId
    is_uploaded:
      custom_name: isUploaded
    created_at:
      custom_name: createdAt
    updated_at:
      custom_name: updatedAt
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - bucket_id
        - name
        - size
        - mime_type
        - etag
        - is_uploaded
        - metadata
        - created_at
        - updated_at
        - uploaded_by_user_id
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
      set:
        uploaded_by_user_id: X-Hasura-User-Id
      columns:
        - id
        - bucket_id
        - name
        - size
        - mime_type
        - etag
        - is_uploaded
        - metadata
update_permissions:
  - role: user
    permission:
      columns:
        - bucket_id
        - name
        - size
        - mime_type
        - etag
        - is_uploaded
        - metadata
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
      check:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
