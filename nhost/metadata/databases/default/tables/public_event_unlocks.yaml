table:
  name: event_unlocks
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
select_permissions:
  - role: user
    permission:
      columns:
        - event_id
        - user_id
        - unlocked_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: service
    permission:
      check: {}
      columns:
        - event_id
        - user_id
