table:
  name: user_trips
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
array_relationships:
  - name: flightLegs
    using:
      foreign_key_constraint_on:
        column: trip_id
        table:
          name: trip_flight_legs
          schema: public
  - name: stays
    using:
      foreign_key_constraint_on:
        column: trip_id
        table:
          name: trip_stays
          schema: public
event_triggers:
  - name: user_trips_match_compute
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
      delete:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 120
    webhook: '{{NHOST_FUNCTIONS_URL}}/internal/trip-matches-compute'
    headers:
      - name: nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
  - role: staff_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns: '*'
      filter: {}
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      set:
        user_id: X-Hasura-User-Id
      columns:
        - title
        - source
        - starts_at
        - ends_at
        - visibility
        - is_active
        - idempotency_key
  - role: service
    permission:
      check: {}
      columns: '*'
update_permissions:
  - role: user
    permission:
      columns:
        - title
        - starts_at
        - ends_at
        - visibility
        - is_active
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
      check:
        user_id:
          _eq: X-Hasura-User-Id
  - role: service
    permission:
      columns: '*'
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: onboarding_state
                schema: public
              _where:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - onboarding_completed_at:
                      _is_null: false
