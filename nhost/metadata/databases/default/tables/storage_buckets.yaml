table:
  name: buckets
  schema: storage
# Nhost Storage queries `buckets` on query_root — not `storage_buckets`.
configuration:
  custom_name: buckets
  custom_root_fields:
    select: buckets
    select_by_pk: bucket
    select_aggregate: buckets_aggregate
  column_config:
    min_upload_file_size:
      custom_name: minUploadFileSize
    max_upload_file_size:
      custom_name: maxUploadFileSize
    download_expiration:
      custom_name: downloadExpiration
    cache_control:
      custom_name: cacheControl
    presigned_urls_enabled:
      custom_name: presignedUrlsEnabled
    created_at:
      custom_name: createdAt
    updated_at:
      custom_name: updatedAt
array_relationships:
  - name: files
    using:
      foreign_key_constraint_on:
        column: bucket_id
        table:
          name: files
          schema: storage
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - download_expiration
        - max_upload_file_size
        - min_upload_file_size
        - cache_control
        - presigned_urls_enabled
        - created_at
        - updated_at
      filter: {}
