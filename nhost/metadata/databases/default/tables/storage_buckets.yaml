table:
  name: buckets
  schema: storage
# Nhost Storage queries `buckets` on query_root — not `storage_buckets`.
configuration:
  custom_name: buckets
  custom_root_fields:
    select: buckets
    select_by_pk: bucket
    select_aggregate: buckets_aggregate
array_relationships:
  - name: files
    using:
      foreign_key_constraint_on:
        column: bucket_id
        table:
          name: files
          schema: storage
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - download_expiration
        - max_upload_file_size
        - min_upload_file_size
      filter: {}
