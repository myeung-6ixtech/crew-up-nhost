type Mutation {
  parseRoster(fileId: uuid!): RosterParseResult!
  submitReport(
    reason: String!
    details: String
    reportedUserId: uuid
    reportedMessageId: uuid
    reportedEventId: uuid
  ): SubmitReportOutput!
}

type RosterParseResult {
  sourceFileId: uuid!
  entries: [RosterParseEntry!]!
  homeBase: String
  trips: [RosterParseTrip!]
  skippedDuties: Int
}

type RosterParseTrip {
  legs: [RosterParseLeg!]!
  layovers: [RosterParseEntry!]!
}

type RosterParseLeg {
  flightNumber: String
  departureAirport: String!
  arrivalAirport: String!
  serviceDate: String!
  scheduledDeparture: timestamptz!
  scheduledArrival: timestamptz!
  deadhead: Boolean!
  lowConfidence: Boolean!
}

type RosterParseEntry {
  flightNumber: String
  departureAirport: String
  arrivalAirport: String
  layoverCity: String
  layoverStart: timestamptz
  layoverEnd: timestamptz
}

type SubmitReportOutput {
  reportId: uuid!
  status: String!
}
