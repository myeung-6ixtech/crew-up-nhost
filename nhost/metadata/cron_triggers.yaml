- name: notification_digest_daily
  webhook: '{{NHOST_FUNCTIONS_URL}}/internal/notification-dispatch'
  # Hourly: each run sends to the people for whom it is now 8 AM (their own time zone).
  schedule: 0 * * * *
  include_in_metadata: true
  payload:
    mode: digest
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 60
    timeout_seconds: 120
    tolerance_seconds: 21600
  headers:
    - name: nhost-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
  comment: Daily digest at 8 AM local time for users with notification_mode=digest (runs hourly)
- name: account_deletion_purge_daily
  webhook: '{{NHOST_FUNCTIONS_URL}}/internal/account-deletion-purge'
  schedule: 0 4 * * *
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 2
    retry_interval_seconds: 300
    timeout_seconds: 300
    tolerance_seconds: 21600
  headers:
    - name: nhost-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
  comment: Purge accounts whose 30-day deletion grace period has ended
- name: flight_schedule_cache_refresh_daily
  webhook: '{{NHOST_FUNCTIONS_URL}}/internal/flight-cache-refresh'
  schedule: 30 3 * * *
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 2
    retry_interval_seconds: 300
    timeout_seconds: 600
    tolerance_seconds: 21600
  headers:
    - name: nhost-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
  comment: Re-validate flight schedule cache rows nearing expiry for upcoming service dates
